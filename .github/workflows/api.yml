name: .NET CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./backend/Ticketing.slnx

      - name: Build
        run: dotnet build ./backend/Ticketing.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./backend/Ticketing.API/Ticketing.API.csproj --configuration Release --no-build --verbosity normal --output ./backend/publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/ticketing/backend:latest -f ./backend/Ticketing.API/Dockerfile ./backend

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ticketing/backend:latest