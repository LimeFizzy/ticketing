name: .NET CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./backend/Ticketing.slnx

      - name: Build
        run: dotnet build ./backend/Ticketing.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./backend/Ticketing.API/Ticketing.API.csproj --configuration Release --no-build --verbosity normal --output ./backend/publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase repository owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${REPO_OWNER}/ticketing/backend:latest -f ./backend/Ticketing.API/Dockerfile ./backend

      - name: Push Docker image
        run: |
          docker push ghcr.io/${REPO_OWNER}/ticketing/backend:latest

  cd:
    needs: ci
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --yes