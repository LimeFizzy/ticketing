name: CI/CD

permissions:
  contents: read
  packages: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  dotnet-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./backend/Ticketing.slnx

      - name: Build
        run: dotnet build ./backend/Ticketing.slnx --configuration Release --no-restore

      - name: Generate Swagger JSON
        env:
          ASPNETCORE_ENVIRONMENT: SwaggerGen
        run: |
          dotnet tool install -g Swashbuckle.AspNetCore.Cli
          swagger tofile --output ./swagger.json \
            ./backend/Ticketing.API/bin/Release/net10.0/Ticketing.API.dll v1

      - name: Upload Swagger JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagger-json
          path: ./swagger.json
          retention-days: 1

      - name: Publish
        run: dotnet publish ./backend/Ticketing.API/Ticketing.API.csproj --configuration Release --no-build --verbosity normal --output ./backend/publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase repository owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ghcr.io/${REPO_OWNER}/ticketing/backend:latest -f ./backend/Ticketing.API/Dockerfile ./backend

      - name: Push Docker image
        run: docker push ghcr.io/${REPO_OWNER}/ticketing/backend:latest

  dotnet-cd:
    needs: dotnet-ci
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --yes

  nextjs-ci-cd:
    needs: dotnet-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v2

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Download Swagger JSON artifact
        uses: actions/download-artifact@v4
        with:
          name: swagger-json
          path: ./frontend

      - name: Generate API client
        run: npm ci && npm run api:gen

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        if: github.ref_name == 'master'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}