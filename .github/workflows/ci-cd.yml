name: CI/CD

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  dotnet-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./backend/Ticketing.slnx

      - name: Build
        run: dotnet build ./backend/Ticketing.slnx --configuration Release --no-restore

      - name: Generate Swagger JSON
        env:
          ASPNETCORE_ENVIRONMENT: SwaggerGen
        run: |
          dotnet tool install -g Swashbuckle.AspNetCore.Cli
          swagger tofile --output ./swagger.json \
            ./backend/Ticketing.API/bin/Release/net10.0/Ticketing.API.dll v1

      - name: Upload Swagger JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagger-json
          path: ./swagger.json
          retention-days: 1

      - name: Publish
        run: dotnet publish ./backend/Ticketing.API/Ticketing.API.csproj --configuration Release --no-build --verbosity normal --output ./backend/publish

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Ticketing.API/Dockerfile
          push: true
          tags: |
            augisbud/ticketing-backend:latest
            augisbud/ticketing-backend:${{ github.sha }}

  dotnet-cd:
    needs: dotnet-ci
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ticketflow
          image: augisbud/ticketing-backend:${{ github.sha }}
          region: ${{ secrets.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

  nextjs-ci-cd:
    needs: dotnet-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v2

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Download Swagger JSON artifact
        uses: actions/download-artifact@v4
        with:
          name: swagger-json
          path: ./frontend

      - name: Generate API client
        run: npm ci && npm run api:gen

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        if: github.ref_name == 'master'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
